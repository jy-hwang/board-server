spring:  application:    name: board-server  datasource:    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy    username: ${RDBMS_USERNAME}    password: ${RDBMS_PASSWORD}    jdbc-url: jdbc:log4jdbc:mariadb://${RDBMS_IP}:${RDBMS_PORT}/${RDBMS_DB}?serverTimezone=Asia/Seoul  cache:    type: redis  data:    redis:      host: ${REDIS_HOST}      port: ${REDIS_PORT}      password: ${REDIS_PASSWORD}      repositories:        enabled: falseexpire:  defaultIime: 3600mybatis:  mapper-locations: classpath:mappers/*.xml  config-location: classpath:mybatis-config.xmllogging:  level:    root: info    com.zaxxer.hikari: WARN